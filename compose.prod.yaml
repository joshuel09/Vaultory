# Vaultory — the production images, for verifying them locally.
#
# READ THIS BEFORE TREATING IT AS A DEPLOYMENT.
#
# This file exists to build and exercise backend/Dockerfile and frontend/Dockerfile on a developer
# machine. It is not a deployment artifact and deliberately does not try to be one: no secret
# management, no TLS, no backups, no replication, and a database running in a container.
#
# It also cannot serve traffic yet, and that is the correct behaviour rather than a gap in the
# file. Authentication is out of scope for feature 001, so the only collector resolver that exists
# is the development one — and the production image does not contain it (FR-019). The backend here
# therefore starts, finds no resolver configured, says so, and exits non-zero. That refusal is the
# thing worth verifying: see the walkthrough in specs/002-docker-dev-environment/quickstart.md.
#
# Usage:
#   docker compose -f compose.prod.yaml build
#   docker compose -f compose.prod.yaml up            # backend exits 1, on purpose
#   docker compose -f compose.prod.yaml down -v

name: vaultory-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultory}
      POSTGRES_USER: ${POSTGRES_USER:-vaultory}
      # No default. A production-shaped stack that starts with a password baked into a committed
      # file is exactly the habit this project should not teach, so Compose fails loudly instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before starting the prod stack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultory} -d ${POSTGRES_DB:-vaultory}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Migrations stay a separate one-shot image rather than something the server runs at boot: a
  # server that migrates on start is a server that migrates once per replica.
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-vaultory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vaultory}?sslmode=disable
      - up
    restart: "no"

  # The Better Auth role's password. Required, never defaulted: the migration creates the role
  # without one, and a LOGIN role with no password cannot authenticate.
  auth-role:
    image: postgres:17-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:-vaultory}
      - -d
      - ${POSTGRES_DB:-vaultory}
      - -c
      - ALTER ROLE vaultory_auth PASSWORD '${VAULTORY_AUTH_DB_PASSWORD:?set VAULTORY_AUTH_DB_PASSWORD before starting the prod stack}';
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth-role:
        condition: service_completed_successfully
    environment:
      VAULTORY_LISTEN_ADDR: 0.0.0.0:8080
      VAULTORY_DATABASE_URL: postgres://${POSTGRES_USER:-vaultory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vaultory}?sslmode=disable
      VAULTORY_IMAGE_STORE: filesystem
      VAULTORY_IMAGE_STORE_PATH: /var/lib/vaultory/images
      VAULTORY_SESSION_SECRET: ${VAULTORY_SESSION_SECRET:?set VAULTORY_SESSION_SECRET before starting the prod stack}
      VAULTORY_IDEMPOTENCY_WINDOW: ${VAULTORY_IDEMPOTENCY_WINDOW:-24h}
      # Note what is absent: VAULTORY_DEV_IDENTITY. Setting it here would not help — this image is
      # built with -tags production and has no development resolver to enable. The server refuses
      # to start either way, which is the point.
    ports:
      - "${VAULTORY_BACKEND_PORT:-8080}:8080"
    volumes:
      - imagestore:/var/lib/vaultory/images
    # "no", not "unless-stopped". This service is expected to exit 1 until a real resolver exists,
    # and a restart policy would turn that single honest refusal into an endless crash loop that
    # buries its own error message.
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build time, not runtime. Next compiles rewrites into the build manifest, so changing
        # which backend this image proxies to means rebuilding the image.
        VAULTORY_BACKEND_ORIGIN: http://backend:8080
    depends_on:
      backend:
        condition: service_started
      auth-role:
        condition: service_completed_successfully
    environment:
      BETTER_AUTH_SECRET: ${VAULTORY_SESSION_SECRET:?set VAULTORY_SESSION_SECRET before starting the prod stack}
      BETTER_AUTH_URL: ${VAULTORY_PUBLIC_URL:?set VAULTORY_PUBLIC_URL, the origin collectors reach Vaultory on}
      # Defaults to the public URL. Set explicitly only when Vaultory is reached on more than one
      # origin; a mismatch here rejects every sign-in with 403 INVALID_ORIGIN.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-${VAULTORY_PUBLIC_URL}}
      # The restricted role, never the backend's.
      BETTER_AUTH_DATABASE_URL: postgres://vaultory_auth:${VAULTORY_AUTH_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-vaultory}?sslmode=disable
    ports:
      - "${VAULTORY_FRONTEND_PORT:-3000}:3000"
    restart: "no"

volumes:
  pgdata:
  imagestore:
