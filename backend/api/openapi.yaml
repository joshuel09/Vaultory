openapi: 3.1.0
info:
  title: Vaultory Collection API
  version: 0.5.0
  description: |
    REST contract between the Vaultory Next.js frontend and the Go backend.

    It began as the contract for feature 001-add-browse-collectibles and is now the living document
    for the whole seam: 0.2.0 adds reading one collectible, editing it, and deleting it
    (006-edit-delete-collectibles); 0.3.0 adds collection statistics and the two gallery filters that
    let a figure trace back to the collectibles behind it (008-collection-value-stats). It stays
    here, under the feature that introduced it, because `npm run generate:api` reads this path and
    one seam must have one source of truth; see
    `specs/008-collection-value-stats/contracts/README.md`.

    This document is the single source of truth for the seam between the two applications
    (Constitution Principle III). Frontend request and response types are generated from it.

    Authorization: every operation acts as the collector resolved server-side from the request's
    session. No operation accepts a collector identifier from the client (FR-028). A resource that
    exists but belongs to another collector responds exactly as one that does not exist — 404, never
    403 (FR-027). A request whose collector cannot be resolved responds 401 with no content
    (FR-029).

servers:
  - url: /api
    description: Reached through the Next.js same-origin rewrite, so the session cookie is present.

tags:
  - name: collectibles
    description: Adding to and browsing a collector's own vault
  - name: trash
    description: Recovering, or destroying, collectibles a collector deleted (feature 010)
  - name: images
    description: Uploading and serving collectible primary images

paths:
  /collectibles:
    post:
      tags: [collectibles]
      operationId: addCollectible
      summary: Add a collectible to the acting collector's vault
      description: |
        Creates one collectible owned by the acting collector (FR-001). A name and a collection
        status are required; every other attribute is optional (FR-002, FR-005, FR-006).

        Every request carries a `submissionKey` the client generates per add attempt. Replaying the
        same key within the idempotency window returns the collectible that key already created,
        rather than creating a second one (FR-047) — so a double-click or a retry after a lost
        response cannot strand the collector with an undeletable duplicate.

        A request with a *different* key creates an independent collectible even when every other
        value is identical; deliberate duplicates are never merged or de-duplicated (FR-023).

        All validation problems are reported together in a single response (FR-020).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCollectibleRequest'
      responses:
        '201':
          description: |
            The collectible was added.

            Also returned when a `submissionKey` is replayed within the idempotency window, carrying
            the collectible that key already created. The status is deliberately identical: the
            client cannot distinguish the two cases and has no need to — in both, exactly one
            collectible exists for that key (FR-047).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectible'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [collectibles]
      operationId: listCollectibles
      summary: Browse the acting collector's collection
      description: |
        Returns one page of the acting collector's collectibles, most recently added first (FR-034)
        unless `sort` asks otherwise, optionally narrowed to a single collection status (FR-037) and
        searched with `q` (feature 011). Never returns another collector's
        collectibles (FR-026).

        Paging is by opaque cursor. An empty `items` array with no `nextCursor` means there is
        nothing further; whether that represents an empty vault or a filter matching nothing is
        distinguished by `totalUnfiltered` (FR-040 versus FR-041).
      parameters:
        - name: status
          in: query
          required: false
          description: Narrow to one collection status. Omit for all statuses (FR-038).
          schema:
            $ref: '#/components/schemas/CollectionStatus'
        - name: series
          in: query
          required: false
          description: |
            Narrow to one series (FR-030, FR-031 of 008). Matched on the same normalised form the
            statistics group by — surrounding whitespace removed and case folded — so that a group
            shown in the statistics and the gallery it links to always contain the same collectibles.

            An empty value selects the collectibles recording no series at all, which is the group the
            statistics label as unspecified. That group holds rows where the field is null, empty, or
            whitespace alike, so the filter cannot be expressed as "is null".
          schema:
            type: string
            maxLength: 200
        - name: manufacturer
          in: query
          required: false
          description: |
            Narrow to one manufacturer, with exactly the semantics of `series` above.
          schema:
            type: string
            maxLength: 200
        - name: q
          in: query
          required: false
          description: |
            Search (feature 011). Every whitespace-separated word must appear, case-insensitively and
            literally, somewhere in the collectible's name, character, series, manufacturer,
            category, scale, edition or notes — not necessarily all in the same one. Empty or
            whitespace-only means no search. Combines with every other filter.
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          required: false
          description: |
            The order (feature 011). Collectibles that do not record the sorted-by attribute come
            after all that do, in either direction, and every order is total, so paging never skips
            or repeats an entry. An unknown value is refused.
          schema:
            type: string
            enum: [added_desc, added_asc, name_asc, name_desc, price_desc, price_asc,
                   purchased_desc, purchased_asc, released_desc, released_asc]
            default: added_desc
        - name: cursor
          in: query
          required: false
          description: |
            Opaque cursor from a previous response's `nextCursor`. Omit for the first page. Valid
            only with the `sort` it was issued for; under another order it is refused.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Maximum entries to return in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 24
      responses:
        '200':
          description: One page of the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /collectibles/statistics:
    get:
      tags: [collectibles]
      operationId: getCollectionStatistics
      summary: Summarise the acting collector's whole vault
      description: |
        Returns counts and monetary totals over every collectible the acting collector owns: the
        whole-vault figures, a summary for each of the four collection statuses, and bounded
        breakdowns by series and by manufacturer.

        **This operation takes no parameters of any kind.** There is therefore no way to express a
        request for another collector's figures — the privacy requirement is satisfied by the shape
        of the operation rather than by a check inside it (FR-003).

        Every figure is computed server-side. Clients display what they receive and derive nothing
        from it (FR-001).

        All figures in one response describe the same moment: they are read inside a single
        transaction, so counts that are required to reconcile cannot disagree because two reads
        observed different states (FR-017a).

        Monetary totals are exact decimal strings and are **not** bounded by the limit that applies to
        a single recorded amount — see `MonetaryTotal` (FR-013).
      responses:
        '200':
          description: |
            The summary. An empty vault is a success carrying zeros, never a 404: a collector with
            nothing in their vault has a vault, and it is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionStatistics'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /collectibles/{collectibleId}:
    parameters:
      - name: collectibleId
        in: path
        required: true
        description: |
          A collectible in the acting collector's vault. One that belongs to another collector is
          answered exactly as one that does not exist (FR-031).
        schema:
          type: string
          format: uuid

    get:
      tags: [collectibles]
      operationId: getCollectible
      summary: Read one collectible for editing
      description: |
        Returns one collectible owned by the acting collector, with every stored value and its
        current `version` (FR-001, FR-002). This is what the edit screen is filled from; attributes
        the collector never supplied come back null rather than as invented defaults (FR-003).

        The representation is identical to the one the gallery returns — one shape, so a detail view
        and a list entry cannot drift apart.
      responses:
        '200':
          description: The collectible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectible'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [collectibles]
      operationId: editCollectible
      summary: Change a collectible already in the vault
      description: |
        Replaces every attribute of one collectible (FR-004). The same validation rules apply as
        when adding, with none relaxed and none added (FR-010), and every problem is reported
        together (FR-014).

        **This is a full replacement, which matters most for `imageId`.** An omitted or null
        `imageId` means *this collectible has no photograph* and removes the one it had (FR-017). A
        client that is not changing the photograph MUST send the current image's id back (FR-018).

        `expectedVersion` is the `version` the collector was shown when they opened the collectible.
        If it is no longer current, the edit is refused with `409` and nothing is written — the
        earlier change is never silently overwritten (FR-027).

        Editing writes neither `createdAt` nor the collectible's identity, so it never moves the
        collectible in the gallery (FR-028). It never creates a second collectible and never touches
        any other entry, including identical ones (FR-007, FR-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCollectibleRequest'
      responses:
        '200':
          description: |
            The edit was applied. The body is the collectible as it now stands, carrying the
            `version` a subsequent edit must present as `expectedVersion`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectible'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [collectibles]
      operationId: deleteCollectible
      summary: Move a collectible to the Trash
      description: |
        Moves one collectible owned by the acting collector to the Trash (FR-022, as amended by
        feature 010). It leaves the vault at once — the gallery, every filter, the statistics — and
        is kept, with its photograph, for 30 days, during which it can be restored from `/trash`.
        After that it is destroyed. Deleting something already in the Trash does not restart its 30
        days.

        **Idempotent.** A collectible that is not in the acting collector's vault — already deleted,
        never existed, or belonging to someone else — is answered `204` just the same (FR-025). A
        retry after a lost response therefore succeeds rather than confusing the collector with an
        error about something they already removed, and the answer for another collector's
        identifier is indistinguishable from the answer for a fictional one (FR-031).

        No `404` is defined for this operation, deliberately. That is not an omission.

        A trashed collectible's photograph stays retrievable by its owner, and only its owner, until
        the collectible leaves the Trash for good; then it stops being retrievable at once (FR-020,
        as amended by feature 010).
      responses:
        '204':
          description: |
            The collectible is not in the acting collector's vault. Returned both when this request
            moved it to the Trash and when it was already absent; the two are deliberately
            indistinguishable.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /trash:
    get:
      tags: [trash]
      operationId: listTrash
      summary: Browse the acting collector's Trash
      description: |
        Returns one page of the acting collector's deleted collectibles that are still within their
        30 days, most recently deleted first (feature 010, FR-006). Never another collector's.
        Something past its 30 days is not listed, whether or not it has been destroyed yet.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's `nextCursor`. Omit for the first page.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Maximum entries to return in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 24
      responses:
        '200':
          description: One page of the Trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /trash/{collectibleId}:
    parameters:
      - name: collectibleId
        in: path
        required: true
        description: |
          A collectible in the acting collector's Trash. One in another collector's Trash is
          answered exactly as one that does not exist (feature 010, FR-013).
        schema:
          type: string
          format: uuid
    delete:
      tags: [trash]
      operationId: deleteFromTrashPermanently
      summary: Destroy a collectible in the Trash, now
      description: |
        Destroys one collectible in the acting collector's Trash and its photograph, at once: the
        photograph stops being retrievable by anyone, including its owner, and its files are removed
        (feature 010, FR-011). Cannot be undone.

        **Idempotent**, as every deletion is: anything not in the acting collector's Trash —
        including a collectible still in the vault — is answered `204` and left alone.
      responses:
        '204':
          description: The collectible is not in the acting collector's Trash.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /trash/{collectibleId}/restore:
    parameters:
      - name: collectibleId
        in: path
        required: true
        description: A collectible in the acting collector's Trash.
        schema:
          type: string
          format: uuid
    post:
      tags: [trash]
      operationId: restoreFromTrash
      summary: Return a collectible from the Trash to the vault
      description: |
        Restores one collectible from the acting collector's Trash, exactly as it was: every
        attribute, its photograph, its `version`, and its position in the gallery (feature 010,
        FR-007).

        Unlike deletion, this is **not** idempotent-success. A collectible that is not in the acting
        collector's Trash within its 30 days — never deleted, already restored, destroyed, expired,
        another collector's, or a malformed id — is answered `404`, so the collector learns it did
        not come back (FR-008).
      responses:
        '200':
          description: The restored collectible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectible'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /images:
    post:
      tags: [images]
      operationId: uploadCollectibleImage
      summary: Upload a primary image
      description: |
        Accepts one image file, validates it by decoding rather than by its declared type
        (FR-009), enforces the 10 MB limit (FR-010), applies EXIF orientation, derives the
        fixed-aspect gallery rendition (FR-014), and stores both.

        Returns an image identifier to pass as `imageId` when adding a collectible. Uploading is
        separate from adding precisely so a refused image never blocks saving the rest of the
        collectible (FR-013).

        A refused upload stores nothing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: One image file — JPEG, PNG, or WebP, at most 10 MB.
      responses:
        '201':
          description: The image was accepted and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectibleImage'
        '400':
          description: |
            The file was not a decodable JPEG, PNG, or WebP image. The error names the accepted
            formats (FR-009).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedFormat:
                  value:
                    error:
                      code: unsupported_image_format
                      message: That file is not a supported image. Vaultory accepts JPEG, PNG, and WebP.
                      fields:
                        - field: file
                          code: unsupported_image_format
                          message: Accepted formats are JPEG, PNG, and WebP.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          description: The file exceeded the 10 MB limit. The error states the limit (FR-010).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tooLarge:
                  value:
                    error:
                      code: image_too_large
                      message: That image is larger than the 10 MB limit.
                      fields:
                        - field: file
                          code: image_too_large
                          message: Maximum image size is 10 MB.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /images/{imageId}/rendition:
    get:
      tags: [images]
      operationId: getImageRendition
      summary: Fetch the gallery rendition of an image
      description: |
        Returns the fixed-aspect gallery rendition bytes. Authorization is checked on every request:
        only the collector who owns the image receives it, and possessing the address grants nothing
        (FR-015). An image belonging to another collector responds 404, indistinguishable from one
        that does not exist (FR-027).

        This is the address the gallery's `<img>` elements use. It is reached through the same-origin
        rewrite so the session cookie accompanies the request.
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The rendition bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              description: Private caching only; a rendition must never be cached by a shared cache.
              schema:
                type: string
                example: private, max-age=3600
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    ValidationFailed:
      description: |
        The request was rejected. Every validation problem found is reported together, not one at a
        time (FR-020).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingRequired:
              summary: Neither required value was supplied
              value:
                error:
                  code: validation_failed
                  message: This collectible could not be saved.
                  fields:
                    - field: name
                      code: required
                      message: A name is required.
                    - field: collectionStatus
                      code: required
                      message: A collection status is required.
            missingSubmissionKey:
              summary: The request carried no submission key
              value:
                error:
                  code: validation_failed
                  message: This collectible could not be saved.
                  fields:
                    - field: submissionKey
                      code: required
                      message: A submission key is required.
            invalidValues:
              summary: Several rules violated at once
              value:
                error:
                  code: validation_failed
                  message: This collectible could not be saved.
                  fields:
                    - field: name
                      code: required
                      message: A name is required.
                    - field: purchasePrice
                      code: negative_amount
                      message: A purchase price cannot be negative.
                    - field: purchaseDate
                      code: date_in_future
                      message: A purchase date cannot be in the future.
                    - field: collectionStatus
                      code: invalid_value
                      message: Choose Owned, Preordered, Wishlist, or Sold.
    Unauthenticated:
      description: |
        The acting collector could not be resolved. No collection content is returned (FR-029).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              value:
                error:
                  code: unauthenticated
                  message: Sign in to view your collection.
    NotFound:
      description: |
        No such resource for the acting collector. Returned identically whether the resource does
        not exist or belongs to another collector, so existence is never revealed (FR-027).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: not_found
                  message: Not found.
    VersionConflict:
      description: |
        The collectible changed after the collector opened it, so the edit was refused and nothing
        was written (FR-027). The body carries the collectible as it now stands, so the collector can
        be shown what it actually says without a second request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionConflictResponse'
          examples:
            stale:
              value:
                error:
                  code: version_conflict
                  message: This collectible changed since you opened it. Here is how it reads now.
                current:
                  id: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
                  version: 4
                  name: Kaiju Sentinel
                  collectionStatus: owned
                  createdAt: '2026-08-14T09:30:00Z'
    UnsupportedMediaType:
      description: The request body's media type is not supported by this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: |
        An unexpected failure. The response carries no internal detail (Principle IV).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              value:
                error:
                  code: internal_error
                  message: Something went wrong. Please try again.

  schemas:
    CollectionStatus:
      type: string
      description: The state of a collectible in the collector's vault. Exactly these four (FR-004).
      enum: [owned, preordered, wishlist, sold]

    MonetaryAmount:
      type: string
      description: |
        An exact decimal amount as a string, with at most two fractional digits. Carried as a string,
        never a JSON number, so no floating-point conversion can occur anywhere in the path
        (Principle IV). `"0.00"` is a recorded amount, distinct from the field being absent (FR-007,
        FR-017).
      pattern: '^(0|[1-9][0-9]{0,9})(\.[0-9]{1,2})?$'
      examples: ['0.00', '249.99', '1250.00']

    MonetaryTotal:
      type: string
      description: |
        An exact decimal **total**, as a string, with at most two fractional digits.

        Deliberately not `MonetaryAmount`. That schema bounds a single *stored* amount to ten integer
        digits, which is what the database column holds. A total is derived, is never stored, and is
        bounded instead by the exact representation used to accumulate it — some seven orders of
        magnitude higher (FR-013). Reusing `MonetaryAmount` here would make a legitimate total fail
        validation on a vault large enough to produce one.

        Carried as a string, never a JSON number, for the same reason every other amount is: a JSON
        number invites a floating-point conversion on the other side, and this is the figure where
        such a conversion would be least visible and most damaging (Principle IV).
      pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
      examples: ['0.00', '1250.00', '48392.17']

    GroupKind:
      type: string
      description: |
        What a breakdown entry represents.

        `named` is a group the collector actually recorded. `unspecified` collects the collectibles
        that record no value for the grouped field. `remainder` is everything beyond the bound on how
        many entries are returned.

        This exists so a client never has to infer a group's nature from its label — an `unspecified`
        group whose label happened to read "Unspecified" would otherwise be indistinguishable from a
        collector who typed that word as a manufacturer.
      enum: [named, unspecified, remainder]

    StatusSummary:
      type: object
      description: |
        The collectibles holding one collection status, and what was paid for them.
      required: [status, count, pricedCount, total]
      properties:
        status:
          $ref: '#/components/schemas/CollectionStatus'
        count:
          type: integer
          minimum: 0
          description: Collectibles with this status.
        pricedCount:
          type: integer
          minimum: 0
          description: |
            How many of those carry a recorded purchase price. `total` covers exactly these, so this
            is what distinguishes a total of `"0.00"` over nothing priced from a genuine zero
            (FR-010).
        total:
          $ref: '#/components/schemas/MonetaryTotal'

    GroupSummary:
      type: object
      description: |
        One entry in a breakdown — a series, a manufacturer, the unspecified group, or the remainder.
      required: [label, kind, count, pricedCount, total]
      properties:
        label:
          type: string
          description: |
            What to display. For a `named` group this is the spelling the collector used most often
            within it, so the view returns their own words rather than a normalised form nobody typed.
            Where no spelling is most common the tie resolves alphabetically, which is repeatable but
            is not a claim about what the collector preferred (FR-027a).
        kind:
          $ref: '#/components/schemas/GroupKind'
        count:
          type: integer
          minimum: 0
        pricedCount:
          type: integer
          minimum: 0
        total:
          $ref: '#/components/schemas/MonetaryTotal'

    CollectionStatistics:
      type: object
      description: |
        Counts and totals over one collector's whole vault.

        There is deliberately no "headline value" field. The four status summaries are returned as
        peers, and which of them a collector sees largest is a presentation decision; putting it here
        would make a change of emphasis a change to this contract.

        No figure here derives from a field the product does not record. In particular there is no
        market value and no sale price, so the total reported against `sold` is what was *paid* for
        those collectibles and must be labelled in those words (FR-019, FR-042).
      required: [totalCount, pricedCount, byStatus, bySeries, byManufacturer]
      properties:
        totalCount:
          type: integer
          minimum: 0
          description: Every collectible in the vault (FR-007).
        pricedCount:
          type: integer
          minimum: 0
          description: |
            How many carry a recorded purchase price. A collectible without one is excluded from every
            monetary total and is not treated as having cost nothing (FR-009).
        byStatus:
          type: array
          description: |
            Exactly four entries, one per collection status, always present and always in the same
            order. A status holding nothing is returned with zeros rather than omitted, so a client
            never has to decide what an absent status means (FR-015).
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/StatusSummary'
        bySeries:
          type: array
          description: |
            Bounded breakdown by series. Named groups first, largest first; the unspecified group and
            the remainder sort below every named group whatever their own size (FR-022).
          items:
            $ref: '#/components/schemas/GroupSummary'
        byManufacturer:
          type: array
          description: Bounded breakdown by manufacturer, with exactly the semantics of `bySeries`.
          items:
            $ref: '#/components/schemas/GroupSummary'

    AddCollectibleRequest:
      type: object
      description: |
        Values for a new collectible. `name` and `collectionStatus` are required; everything else is
        optional (FR-005, FR-006). An omitted field means the collector recorded nothing, which is
        distinct from an empty string or zero (FR-007).
      required: [submissionKey, name, collectionStatus]
      additionalProperties: false
      properties:
        submissionKey:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            A key the client generates once per add attempt and replays on retry. Replaying it
            within the idempotency window returns the collectible it already created instead of
            creating another (FR-047). A new key always creates an independent collectible, which
            is what keeps deliberate duplicates working (FR-023).

            Regenerate it only when the collector starts a new collectible — never per keystroke,
            and never per network attempt.
          examples: ['01J8Z3K7QX4M9V2N6P0R5T8W1Y']
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Required. Rejected if empty once surrounding whitespace is removed (FR-003).
        collectionStatus:
          $ref: '#/components/schemas/CollectionStatus'
        character:
          type: [string, 'null']
          maxLength: 200
        series:
          type: [string, 'null']
          maxLength: 200
          description: The series or franchise.
        manufacturer:
          type: [string, 'null']
          maxLength: 200
        category:
          type: [string, 'null']
          maxLength: 100
        scale:
          type: [string, 'null']
          maxLength: 50
        edition:
          type: [string, 'null']
          maxLength: 200
          description: The edition or variant.
        purchasePrice:
          oneOf:
            - $ref: '#/components/schemas/MonetaryAmount'
            - type: 'null'
        purchaseDate:
          type: [string, 'null']
          format: date
          description: A calendar date, not later than today (FR-018).
        releaseDate:
          type: [string, 'null']
          format: date
          description: A calendar date, past or future, in any combination with the other values (FR-019).
        notes:
          type: [string, 'null']
          maxLength: 2000
        imageId:
          type: [string, 'null']
          format: uuid
          description: |
            Identifier returned by a prior upload. Must name an image owned by the acting collector
            (FR-015). At most one image per collectible (FR-011); omit for none (FR-012).
      examples:
        - submissionKey: 01J8Z3K7QX4M9V2N6P0R5T8W1Y
          name: Kaiju Sentinel
          collectionStatus: owned
        - submissionKey: 01J8Z3M2WB7C4D9F1G6H0J5K3L
          name: Kaiju Sentinel
          collectionStatus: owned
          character: Sentinel Prime
          series: Kaiju Wars
          manufacturer: Apex Studio
          category: Statue
          scale: '1/4'
          edition: Deluxe Exclusive
          purchasePrice: '1250.00'
          purchaseDate: '2026-08-14'
          releaseDate: '2026-11-30'
          notes: Box has a small dent on the lower left corner.
          imageId: 6f9619ff-8b86-d011-b42d-00cf4fc964ff

    EditCollectibleRequest:
      type: object
      description: |
        The complete set of values a collectible should have after the edit. `name` and
        `collectionStatus` are required; every other attribute is optional and an omitted or null
        field means the collector recorded nothing, which is distinct from an empty string
        (FR-005).

        A full replacement: whatever is not sent is cleared. For `imageId` in particular, omitting
        it removes the photograph (FR-017), so an edit that leaves the photograph alone must send
        the current image's id (FR-018).
      required: [expectedVersion, name, collectionStatus]
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: |
            The `version` carried by the collectible when the collector opened it. If it is no
            longer current the edit is refused with `409` and nothing is written (FR-027).
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Required. A value that is only whitespace counts as missing, exactly as when adding
            (FR-011).
        collectionStatus:
          $ref: '#/components/schemas/CollectionStatus'
        character:
          type: [string, 'null']
          maxLength: 200
        series:
          type: [string, 'null']
          maxLength: 200
        manufacturer:
          type: [string, 'null']
          maxLength: 200
        category:
          type: [string, 'null']
          maxLength: 100
        scale:
          type: [string, 'null']
          maxLength: 50
        edition:
          type: [string, 'null']
          maxLength: 200
        purchasePrice:
          oneOf:
            - $ref: '#/components/schemas/MonetaryAmount'
            - type: 'null'
          description: |
            An exact decimal string. Reading an amount and saving it back unchanged must not alter
            it (FR-013). Negative amounts are refused; `"0.00"` is a recorded amount (FR-012).
        purchaseDate:
          type: [string, 'null']
          format: date
          description: Not later than the collector's current date (FR-012).
        releaseDate:
          type: [string, 'null']
          format: date
          description: Past or future, in any combination with status and purchase date.
        notes:
          type: [string, 'null']
          maxLength: 2000
        imageId:
          type: [string, 'null']
          format: uuid
          description: |
            The photograph this collectible should have *after* the edit. Null or omitted removes
            it, and the designed placeholder is shown in its place (FR-017). Send the current id to
            keep the existing photograph (FR-018); send a newly uploaded id to replace it, after
            which the old photograph is no longer retrievable by anyone (FR-020).

            An id that is not this collector's own is refused as an unknown image, in the same words
            as one that never existed (FR-021, FR-031).
      examples:
        - expectedVersion: 3
          name: Kaiju Sentinel
          collectionStatus: owned
          character: Sentinel Prime
          series: Kaiju Wars
          manufacturer: Apex Studio
          category: Statue
          scale: '1/4'
          edition: Deluxe Exclusive
          purchasePrice: '1180.00'
          purchaseDate: '2026-08-14'
          releaseDate: '2026-11-30'
          notes: Box has a small dent on the lower left corner.
          imageId: 6f9619ff-8b86-d011-b42d-00cf4fc964ff

    VersionConflictResponse:
      type: object
      description: |
        A refused edit, with the collectible as it actually stands. Distinct from `ErrorResponse`
        because it carries that collectible; the error envelope itself is unchanged.
      required: [error, current]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [version_conflict]
            message:
              type: string
        current:
          $ref: '#/components/schemas/Collectible'

    Collectible:
      type: object
      description: One collectible in the acting collector's vault.
      required: [id, version, name, collectionStatus, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        collectionStatus:
          $ref: '#/components/schemas/CollectionStatus'
        character:
          type: [string, 'null']
        series:
          type: [string, 'null']
        manufacturer:
          type: [string, 'null']
        category:
          type: [string, 'null']
        scale:
          type: [string, 'null']
        edition:
          type: [string, 'null']
        purchasePrice:
          oneOf:
            - $ref: '#/components/schemas/MonetaryAmount'
            - type: 'null'
        purchaseDate:
          type: [string, 'null']
          format: date
        releaseDate:
          type: [string, 'null']
          format: date
        notes:
          type: [string, 'null']
        image:
          oneOf:
            - $ref: '#/components/schemas/CollectibleImageRef'
            - type: 'null'
          description: |
            Absent when the collector supplied no image; the gallery shows its designed placeholder
            instead (FR-033).
        createdAt:
          type: string
          format: date-time
          description: |
            When the collectible was added. The default gallery order (FR-034). Editing never
            changes it, so an edit never moves a collectible in the gallery (FR-028).
        version:
          type: integer
          minimum: 1
          description: |
            Changes on every change to this collectible (FR-027a). Send it back as
            `expectedVersion` when editing; an edit carrying a version that is no longer current is
            refused rather than applied over the newer values (FR-027).

    CollectibleImageRef:
      type: object
      description: How the gallery reaches a collectible's image.
      required: [id, renditionUrl, width, height]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        renditionUrl:
          type: string
          description: |
            Path of the gallery rendition, authorized on every request (FR-015). Same-origin, so the
            session cookie accompanies the `<img>` request.
          examples: ['/api/images/6f9619ff-8b86-d011-b42d-00cf4fc964ff/rendition']
        width:
          type: integer
          description: Rendition width in pixels. Identical for every rendition (FR-014).
        height:
          type: integer
          description: Rendition height in pixels. Identical for every rendition (FR-014).

    CollectibleImage:
      type: object
      description: An accepted upload, ready to attach to a collectible.
      required: [id, renditionUrl, contentType, byteSize, width, height]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Pass as `imageId` when adding a collectible.
        renditionUrl:
          type: string
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: What the decode determined, never what the client declared (FR-009).
        byteSize:
          type: integer
          description: Size of the accepted upload in bytes; at most 10485760 (FR-010).
          maximum: 10485760
        width:
          type: integer
        height:
          type: integer

    CollectionPage:
      type: object
      description: One page of the acting collector's collection.
      required: [items, totalUnfiltered]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Entries in this page, most recently added first (FR-034).
          items:
            $ref: '#/components/schemas/Collectible'
        nextCursor:
          type: [string, 'null']
          description: Cursor for the following page, or absent when this is the last page (FR-035).
        totalUnfiltered:
          type: integer
          minimum: 0
          description: |
            How many collectibles the collector has in total, ignoring any status filter. Lets the
            frontend tell an empty vault (FR-041) from a filter that matched nothing (FR-040)
            without a second request.

    TrashedCollectible:
      type: object
      description: |
        One collectible in the Trash. The collectible is nested, not extended: it is the same
        `Collectible` the vault returns, so restoring it changes nothing about its shape.
      required: [collectible, deletedAt, purgeAt]
      additionalProperties: false
      properties:
        collectible:
          $ref: '#/components/schemas/Collectible'
        deletedAt:
          type: string
          format: date-time
          description: When it was moved to the Trash.
        purgeAt:
          type: string
          format: date-time
          description: |
            When it will be destroyed — 30 days after `deletedAt`. Computed by the server, because
            retention is a rule of the system, not of the client.

    TrashPage:
      type: object
      description: One page of the acting collector's Trash.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Entries in this page, most recently deleted first.
          items:
            $ref: '#/components/schemas/TrashedCollectible'
        nextCursor:
          type: [string, 'null']
          description: Cursor for the following page, or absent when this is the last page.

    ErrorResponse:
      type: object
      description: |
        The single error envelope for every failing operation. Carries codes the frontend can act on
        and messages fit to show a collector; never internal detail (Principle IV).
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable classification of the failure.
              examples: [validation_failed, unauthenticated, not_found, image_too_large, unsupported_image_format, internal_error]
            message:
              type: string
              description: A message suitable for display to a collector.
            fields:
              type: array
              description: |
                One entry per offending field. Present when the failure is a validation failure; all
                problems appear together (FR-020).
              items:
                type: object
                required: [field, code, message]
                additionalProperties: false
                properties:
                  field:
                    type: string
                    description: Name of the offending request field.
                  code:
                    type: string
                    examples: [required, invalid_value, negative_amount, date_in_future, too_long, unknown_image]
                  message:
                    type: string
