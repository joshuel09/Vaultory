# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# How CodeRabbit reviews Vaultory (issue #65).
#
# Unconfigured, it reviews like a stranger: it finds the unchecked error and misses the things
# this project is actually strict about, because those live in a constitution it has never read.
# So the knowledge base points at that document rather than restating it here — a second copy of
# a rule is a thing to keep in step, and this one would drift silently — and the per-directory
# instructions below say what tends to go wrong in each place.
#
# Nothing here blocks a merge. Three required checks are the gate, and which checks are required
# is a decision for the people working here, not a side effect of installing a bot.

language: en-US

# 250 characters is the limit, so this has to be the short version of the house style.
tone_instructions: >-
  Direct and concrete. Say what is wrong, where, and what it would cause. One finding you can
  demonstrate beats five you suspect. Say plainly when something is fine.

reviews:
  # `assertive` is one word away if these turn out too quiet. Starting quieter on purpose: a
  # reviewer nobody reads is worse than no reviewer, and two people work on this repository.
  profile: chill

  # Comment, never formally request changes, and never fail a commit status. Humans decide what
  # merges; see the ruleset described in README.md.
  request_changes_workflow: false
  fail_commit_status: false

  auto_review:
    enabled: true
    # A draft says "in progress, do not merge" while still showing every commit. Reviewing one is
    # reviewing a sentence half-written.
    drafts: false
    # Pull requests stack here — #59 was based on #58's branch, not on main — and the default
    # only reviews what targets the default branch, which would have skipped it silently.
    base_branches:
      - ".*"

  path_filters:
    # Spec Kit artifacts: specification, plan, research, tasks. Prose, hundreds of lines per
    # feature, and reviewed as part of the feature's own cycle rather than line by line.
    - "!specs/**"
    # Generated by `npm run generate:api` from backend/api/openapi.yaml, and carries a "do not
    # make direct changes" banner. Review the contract it came from instead.
    - "!frontend/lib/types/api.ts"
    - "!**/package-lock.json"
    - "!**/go.sum"

  path_instructions:
    - path: "backend/internal/**/*.go"
      instructions: |
        Go owns business logic, validation, authorization and persistence. A rule that exists only
        in the frontend is a bug, even when it agrees with the server.

        Every query against a collector's data must carry collector_id as a predicate. Another
        collector's resource answers 404, never 403 — a 403 confirms the thing exists.

        Monetary values are exact decimals, never floating point. Flag a float anywhere on the
        path a price travels, a cursor and a JSON shape included.

        A write that changes an existing row presents the version it was based on, and takes
        SELECT ... FOR UPDATE rather than a conditional UPDATE: a conditional UPDATE cannot tell
        "not yours" from "stale", and last-write-wins is the silent overwrite that is forbidden
        here.

        An image stops being fetchable when its row is deleted, not when it is unlinked.
        Releasing one means deleting the row inside the same transaction and queueing its files
        in pending_image_deletions.

        Sessions are verified in Go, against the session row in PostgreSQL. A collector id taken
        from a header, body or query parameter is never trusted.

    - path: "backend/migrations/**"
      instructions: |
        Schema changes ship as reversible migrations, with no exceptions. Every up has a down that
        reverses exactly what it created: no less, and no more — a down that drops more than its
        up created survives the reversal and fails the re-apply, which is what the CI job is for.

        golang-migrate tracks a single version number, so two branches adding the same number
        collide and the lower one is skipped permanently. Flag a number already present on main.

        No credential belongs in a tracked migration; this repository is public. The restricted
        role is created without a password and given one at startup.

    - path: "backend/api/openapi.yaml"
      instructions: |
        This document is the source of truth for the frontend/backend seam. A change to it needs
        the version bumped and frontend/lib/types/api.ts regenerated in the same pull request —
        a contract that has moved without its generated types is a seam that compiles and lies.

    - path: "frontend/**"
      instructions: |
        Next.js renders and nothing more. Business logic, validation and authorization live in Go.

        Never hand-write a request or response shape: everything derives from lib/types/api.ts,
        which is generated from the OpenAPI document.

        A vault is private and that is enforced on the server. Nothing here should decide what a
        collector may see, and nothing here should restate a server-side limit as a constant that
        can drift from it.

    - path: "backend/tests/**"
      instructions: |
        The integration and contract suites carry a build tag, so a plain `go vet` does not
        compile them; `go vet -tags integration ./...` does. They share one database and must run
        with -p 1, because `go test` runs packages in parallel and the resulting failures look
        like product bugs.

        A guarantee that lives in the schema — a composite foreign key, numeric(12,2) exactness,
        uniqueness under concurrency — is tested against a real PostgreSQL. A fake would only
        assert that the Go code believes in it.

    # Three plain globs rather than one brace expression: a path pattern that turns out not to be
    # supported does not fail, it just never matches, and nothing would say so.
    - path: "compose*.yaml"
      instructions: |
        The stack must stay runnable with Docker as the only prerequisite: no host-installed Go,
        Node, PostgreSQL or migration tool. Every port is overridable without editing a tracked
        file, and every default is development-only and documented inline where it is set.

        compose.prod.yaml verifies the production images locally and is not a deployment artifact.

    - path: "Makefile"
      instructions: |
        Every documented command lives here and is the thing CI calls, so that the isolation a
        suite depends on has one definition. A target that destroys data asks for a typed
        confirmation first, the way `reset` and `db-rewind` do.

    - path: "scripts/**"
      instructions: |
        These run inside containers built from small images, so POSIX sh, not bash. A migration
        number carries leading zeros and a shell arithmetic context reads those as octal, which
        is why base ten is forced explicitly where one is parsed.

    - path: ".github/workflows/**"
      instructions: |
        Three checks are required to merge; the browser suite and the migration round trip run and
        are visible but do not block. Making a check required changes the merge policy for
        everyone, so raise it rather than waving it through.

        Jobs call the Makefile target rather than restating what it does. A second definition of
        the test isolation is a thing to keep in step, and that one has already cost this project
        a round of failures that looked like product bugs.

knowledge_base:
  code_guidelines:
    enabled: true
    # The rules, from the documents that already hold them.
    filePatterns:
      - ".specify/memory/constitution.md"
      - "CONTRIBUTING.md"
  learnings:
    # One repository, so keep what it learns here rather than carrying it between projects.
    scope: local
