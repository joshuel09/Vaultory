# What runs on every pull request.
#
# Until this existed, "green" meant somebody had run `make test` locally and said so in the PR
# description. `main` is protected by a ruleset that requires a pull request, but a ruleset cannot
# require a *passing* one — required status checks can only name checks that exist. These are
# those checks (issue #37).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer worthless, so stop paying for it.
# Never applied to main: those runs are the record of what landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend — vet, build, unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # From go.mod, so the toolchain here cannot drift from the one the project declares.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./tests/unit/... ./internal/...

      # The integration and contract suites carry a build tag, so nothing above compiles them.
      # Without this step a type error in those files reaches main and is found by whoever next
      # runs the database suites.
      - name: Type-check the tagged suites
        run: go vet -tags integration ./...

  frontend:
    name: Frontend — lint, typecheck, unit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfiles. A version that only CI uses is a version nothing else tests.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database-suites:
    name: Backend — integration and contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `make test`, not a hand-written equivalent.
      #
      # The compose file is where the isolation lives: a throwaway database with no route to the
      # development one, migrations applied first, and `-p 1` because both packages share that
      # database and `go test` would otherwise run them in parallel. Restating any of that here
      # would be a second definition to keep in step, and the -p 1 flag in particular has already
      # cost this project a round of failures that looked like product bugs.
      - name: make test
        run: make test

  migrations:
    name: Migrations — up, down, up
    runs-on: ubuntu-latest

    # A cluster of its own, and that matters more than it looks. `vaultory_auth` is a role, which
    # is cluster-level rather than database-level, so `down -all` against a cluster that also holds
    # a development database fails — the role cannot be dropped while objects elsewhere depend on
    # it — and leaves the database dirty. A service container has nothing else in it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vaultory_dev
          POSTGRES_USER: vaultory
          # Lives for the length of one job, in a container reachable only from it.
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultory -d vaultory_dev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      # The constitution asks that schema changes ship as reversible migrations, with no
      # exceptions. Until this job, the only thing behind that was whoever remembered to run the
      # down migration by hand — and a `down` that is wrong is not discovered when it is written,
      # but when somebody needs to roll back, which is the worst moment to find out (issue #60).
      #
      # Up, all the way down, and up again: the third step is the one that matters, because a
      # `down` that drops more than its `up` created passes the second and fails the third.
      - name: Apply, reverse, and re-apply every migration
        env:
          DATABASE_URL: postgres://vaultory:ci_only_not_a_real_secret@localhost:5432/vaultory_dev?sslmode=disable
        run: |
          set -euo pipefail

          # Read the tool's version from compose rather than naming it again here. A second
          # definition is a thing to keep in step, and this one would drift silently.
          image=$(sed -n 's/^x-migrate-image: &migrate-image //p' compose.yaml)
          echo "migrate image: $image"

          migrate() {
            docker run --rm --network host \
              -v "$PWD/backend/migrations:/migrations:ro" \
              "$image" -path=/migrations -database="$DATABASE_URL" "$@"
          }

          migrate up
          migrate down -all
          migrate up

          # `migrate` reports a failed step by leaving the version dirty, and reports it on
          # stderr. Without this the job would pass on a migration that half-applied.
          if migrate version 2>&1 | grep -q dirty; then
            echo "::error::migrations left the database dirty"
            exit 1
          fi

  authorship:
    name: Authorship — commits carry a noreply address
    runs-on: ubuntu-latest
    # Only on a pull request, which is the whole point: this is the last moment the branch can
    # still be rewritten freely. Once a squash merge has happened the address is on main *and* in
    # a refs/pull ref that nothing can rewrite, and both remedies left are bad ones — rewriting
    # shared history, or detaching an email from an account and losing its contributions elsewhere.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit has to be present to diff against it.
          fetch-depth: 0

      # Four commits once reached main authored with a work email belonging to a different GitHub
      # account, which then appeared in this repository's Contributors list. One `git config`
      # call did it — run inside a linked worktree, which shares .git/config rather than keeping
      # its own — and nothing caught it until somebody looked at the front page days later
      # (issue #74).
      #
      # An allowlist rather than a denylist, deliberately: a denylist would have to name the
      # company domain, and this repository is public. Every commit in its history already uses a
      # noreply address, so requiring one costs nothing and names nobody.
      - name: Check the author, committer and co-authors of every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          found="$RUNNER_TEMP/addresses"
          : > "$found"

          for sha in $(git rev-list "$BASE..$HEAD"); do
            # Author and committer. They differ more often than people expect — a rebase or a
            # web-UI merge rewrites the committer and leaves the author alone.
            git log -1 --format="$sha author    %ae" "$sha" >> "$found"
            git log -1 --format="$sha committer %ce" "$sha" >> "$found"

            # Co-authors count too. GitHub attributes a commit to every account named in one of
            # these trailers, and a squash merge copies the branch commit's author into one — which
            # is exactly how the wrong account reached main last time.
            git log -1 --format='%b' "$sha" |
              sed -n 's/^[Cc]o-[Aa]uthored-[Bb]y:.*<\([^>]*\)>.*/\1/p' |
              while IFS= read -r address; do
                [ -n "$address" ] && echo "$sha co-author $address"
              done >> "$found"
          done

          # Anything not ending in an allowed address.
          bad="$RUNNER_TEMP/bad"
          grep -vE ' (.+@users\.noreply\.github\.com|noreply@github\.com|noreply@anthropic\.com)$' "$found" > "$bad" || true

          if [ -s "$bad" ]; then
            echo "::error::a commit on this branch carries an address that is not a noreply address"
            while IFS= read -r line; do
              echo "::error::$line"
            done < "$bad"
            echo
            echo "Fix it before merging, while the branch can still be rewritten:"
            echo "  git config --get user.email        # check what you are committing as"
            echo "  git config --local --unset user.email"
            echo "  git rebase --exec 'git commit --amend --no-edit --reset-author' $BASE"
            exit 1
          fi

          echo "every commit carries a noreply address"
