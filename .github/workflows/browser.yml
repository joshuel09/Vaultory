# The browser suite: three viewport projects against the whole stack.
#
# This was first written to run only on demand, on the reasoning that twenty-odd minutes was too
# much to put in front of every pull request and that a contended run would produce failures
# belonging to the machine rather than to the product. Both halves of that turned out to be wrong,
# and measuring beat assuming: on a hosted runner the suite finished in **15.3 minutes with 406
# passed, 8 skipped and zero flakes** — faster and steadier than the same suite on a developer
# machine, which was taking 22 minutes with four flakes.
#
# The reason is the thing the old comment had backwards. The flakiness was never inherent to the
# suite; it came from running it on a machine already busy with other work, where the Next dev
# server had grown to a gigulp and a half of memory. A runner is cold, idle and exclusive, which is
# the environment this suite wants.
#
# So it runs on every pull request. It is kept in its own workflow rather than folded into ci.yml
# because it is an order of magnitude slower than the other jobs, and because having it separately
# dispatchable is useful when the flake rate is in question.
name: Browser suite

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright — desktop, tablet, mobile
    runs-on: ubuntu-latest
    # Roughly double the measured 15.3 minutes. Tight enough that a hang is reported rather than
    # burning an hour, loose enough that an ordinarily slow run is not cut off and misread.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: make up

      - name: Run the browser suite
        run: make test-e2e

      # The report is the evidence, and a failed run is exactly when it is wanted.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - if: failure()
        name: Stack logs
        run: docker compose --profile dev logs --tail 200
